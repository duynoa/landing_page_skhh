<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cảm ơn bạn - SKHHVN</title>
    <link rel="shortcut icon" href="images/favicon.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap&subset=vietnamese" rel="stylesheet">
    <style>
        :root {
            --primary: #752060;
            --primary-light: #8d2873;
            --primary-dark: #5d1a4c;
            --white: #ffffff;
            --text: #333333;
        }
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: var(--primary);
            background: linear-gradient(45deg, var(--primary-dark), var(--primary), var(--primary-light));
            text-align: center;
        }
        .container {
            padding: 2.5rem;
            background: var(--white);
            border-radius: 20px;
            max-width: 600px;
            margin: 1rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: var(--primary);
            font-weight: 600;
        }
        p {
            font-size: 1.2rem;
            margin-bottom: 2rem;
            line-height: 1.6;
            color: var(--text);
        }
        .button {
            display: inline-block;
            padding: 1rem 2rem;
            font-size: 1.1rem;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 500;
            transition: all 0.3s ease;
            margin: 0.5rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.15);
        }
        .button.download {
            background: var(--primary);
            color: var(--white);
            border: none;
        }
        .button.download:hover {
            background: var(--primary-light);
        }
        .button.home {
            background: var(--white);
            color: var(--primary);
            border: 2px solid var(--primary);
        }
        .button.home:hover {
            background: rgba(117, 32, 96, 0.05);
        }
        .icon {
            margin-right: 8px;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .container {
            animation: fadeIn 0.6s ease-out;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Cảm ơn bạn!</h1>
        <p>Chúng tôi đã nhận được thông tin của bạn.<br>Hãy tải bản demo sách ngay bây giờ!</p>
        <div>
            <a href="images/7-giay-x2-suc-manh-ban-demo.pdf" download class="button download">
                <span class="icon">⬇️</span>Tải Bản Demo
            </a>
            <a href="/" class="button home">
                <span class="icon">🏠</span>Về Trang Chủ
            </a>
        </div>
    </div>
</body>
</html>
